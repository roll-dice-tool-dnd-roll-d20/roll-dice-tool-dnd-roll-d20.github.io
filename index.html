<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roll Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
<style>
  :root{
    --bg:#e9e4d4;
    --bg-card:#f5f1e5;
    --ink:#2c2a20;
    --ink-soft:#66624f;
    --moss:#4b6142;
    --moss-dark:#354730;
    --ochre:#a56f2b;
    --berry:#7c3030;
    --border:#c9c1a4;
    --border-soft:#dcd5bd;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1d2019;
      --bg-card:#262a20;
      --ink:#e9e4d4;
      --ink-soft:#a9a58f;
      --moss:#7fa06f;
      --moss-dark:#5c7a4f;
      --ochre:#c99457;
      --berry:#d17a7a;
      --border:#3a3f30;
      --border-soft:#2e321f;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    padding:28px 16px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  header{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    border-bottom:2px solid var(--border);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  h1{
    font-size:1.7rem;
    margin:0;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .title-info-icon{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-soft);
    color:var(--ink-soft);font-size:0.72rem;font-weight:700;font-style:italic;
    font-family:Georgia,serif;vertical-align:middle;margin-left:4px;
    cursor:pointer;
  }
  header p{
    margin:2px 0 0;
    color:var(--ink-soft);
    font-size:0.85rem;
    font-family:-apple-system,"Segoe UI",sans-serif;
  }
  .sync-status{
    display:flex;align-items:center;gap:6px;
    margin-top:5px;
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.78rem;color:var(--ink-soft);
  }
  .sync-dot{
    width:8px;height:8px;border-radius:50%;flex-shrink:0;
    background:var(--berry);
    box-shadow:0 0 0 2px var(--bg);
  }
  .sync-dot.online{background:var(--moss);}
  .change-account-btn{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.72rem;margin-top:6px;padding:4px 9px;
    border:1px solid var(--border);border-radius:5px;
    background:transparent;color:var(--ink-soft);cursor:pointer;
  }
  .change-account-btn:hover{border-color:var(--moss);color:var(--moss-dark);}
  .account-picker{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px;}
  .account-picker-btn{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.72rem;font-weight:700;color:#fff;
    padding:7px 11px;border:2px solid transparent;border-radius:7px;
    cursor:pointer;opacity:0.7;letter-spacing:0.01em;
    text-shadow:0 1px 1px rgba(0,0,0,0.35);
  }
  .account-picker-btn:hover{opacity:0.9;}
  .account-picker-btn.selected{opacity:1;border-color:var(--ink);}
  .account-picker-label{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.78rem;font-weight:700;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:0.04em;
    margin-bottom:8px;
  }
  .quickroll{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .version-tag{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.65rem;color:var(--ink-soft);opacity:0.75;letter-spacing:0.02em;
  }
  .char-tabs{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:340px;}
  .char-tab{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.68rem;font-weight:700;color:#fff;
    padding:7px 18px 7px 10px;border:none;border-radius:7px 7px 3px 3px;
    cursor:pointer;opacity:0.68;letter-spacing:0.01em;
    text-shadow:0 1px 1px rgba(0,0,0,0.35);
    box-shadow:0 1px 2px rgba(0,0,0,0.18);
    transition:opacity .12s ease, transform .12s ease;
    position:relative;
  }
  .char-tab:hover{opacity:0.88;}
  .char-tab.active{opacity:1;transform:translateY(-2px);box-shadow:0 3px 6px rgba(0,0,0,0.28);}
  .char-tab-lock{
    position:absolute;top:1px;right:1px;
    width:14px;height:14px;line-height:14px;
    font-size:0.62rem;text-align:center;
    border-radius:50%;cursor:pointer;
    background:rgba(0,0,0,0.3);
    opacity:0.85;
  }
  .char-tab-lock:hover{opacity:1;background:rgba(0,0,0,0.5);}
  .char-tab-lock.locked{background:rgba(0,0,0,0.55);}
  .sheet-content{position:relative;}
  .lock-overlay{
    position:absolute;inset:0;z-index:50;
    display:none;justify-content:center;align-items:flex-start;
    background:rgba(124,48,48,0.06);border-radius:8px;
  }
  .lock-overlay-box{
    margin-top:10px;
    background:var(--berry);color:#fff;
    border-radius:999px;
    padding:9px 12px 9px 16px;
    display:flex;align-items:center;gap:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.25);
    font-family:-apple-system,"Segoe UI",sans-serif;
    position:sticky;top:10px;
  }
  .lock-overlay-icon{font-size:1rem;}
  .lock-overlay-title{font-weight:700;font-size:0.85rem;white-space:nowrap;}
  .lock-overlay-box button{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.78rem;padding:5px 12px;border:none;border-radius:999px;
    background:rgba(255,255,255,0.92);color:var(--berry);cursor:pointer;font-weight:700;
  }
  .lock-overlay-box button:hover{background:#fff;}
  .char-tab-rename{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.68rem;font-weight:700;color:#fff;
    padding:6px 9px;border:1px solid rgba(255,255,255,0.65);border-radius:7px 7px 3px 3px;
    outline:none;width:88px;text-shadow:0 1px 1px rgba(0,0,0,0.3);
  }
  .die-btn{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.85rem;
    padding:7px 11px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:5px;
    color:var(--ink);
    cursor:pointer;
  }
  .die-btn:hover{border-color:var(--moss);}
  .dice-count{
    width:48px;padding:7px 6px;border:1px solid var(--border);border-radius:5px;
    background:var(--bg-card);color:var(--ink);font-size:0.85rem;
    font-family:-apple-system,"Segoe UI",sans-serif;text-align:center;
  }
  .dice-count-x{
    font-family:-apple-system,"Segoe UI",sans-serif;
    color:var(--ink-soft);font-size:0.85rem;align-self:center;
  }
  .settings-bar{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    align-items:center;
    background:var(--bg-card);
    border:1px solid var(--border-soft);
    border-radius:8px;
    padding:12px 16px;
    margin-bottom:22px;
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.88rem;
  }
  .settings-bar label{display:flex;align-items:center;gap:6px;color:var(--ink-soft);}
  .settings-bar input[type=number]{
    width:52px;padding:5px 6px;border:1px solid var(--border);border-radius:4px;
    background:var(--bg);color:var(--ink);font-size:0.9rem;
  }
  .mode-group{display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px;}
  .mode-group button{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.8rem;padding:5px 10px;border:none;background:transparent;color:var(--ink-soft);
    border-radius:4px;cursor:pointer;
  }
  .mode-group button.active{background:var(--moss);color:#fff;}
  /* Disadvantage = light red, Normal = neutral, Advantage = green.
     Each is softly tinted when idle and fills in when selected. */
  .mode-group button[data-mode="dis"]{background:#f6dcd8;color:#7c2a22;}
  .mode-group button[data-mode="normal"]{background:#e0ddd0;color:#4a473a;}
  .mode-group button[data-mode="adv"]{background:#d3e6c9;color:#2f5a25;}
  .mode-group button[data-mode="dis"]:hover{background:#f1cbc6;}
  .mode-group button[data-mode="normal"]:hover{background:#d3d0c1;}
  .mode-group button[data-mode="adv"]:hover{background:#c3dcb6;}
  .mode-group button.active[data-mode="dis"]{background:#e07b72;color:#fff;}
  .mode-group button.active[data-mode="normal"]{background:#8a8672;color:#fff;}
  .mode-group button.active[data-mode="adv"]{background:#5e9c4d;color:#fff;}
  @media (prefers-color-scheme: dark){
    .mode-group button[data-mode="dis"]{background:#4a2a27;color:#f0b5ae;}
    .mode-group button[data-mode="normal"]{background:#3a3d33;color:#cfcbb6;}
    .mode-group button[data-mode="adv"]{background:#2c4326;color:#b9d9a9;}
    .mode-group button[data-mode="dis"]:hover{background:#5a3330;}
    .mode-group button[data-mode="normal"]:hover{background:#464a3d;}
    .mode-group button[data-mode="adv"]:hover{background:#365431;}
    .mode-group button.active[data-mode="dis"]{background:#c0615a;color:#fff;}
    .mode-group button.active[data-mode="normal"]{background:#77745f;color:#fff;}
    .mode-group button.active[data-mode="adv"]{background:#5f9a52;color:#fff;}
  }
  .crit-toggle{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.8rem;padding:6px 12px;border:1px solid var(--berry);border-radius:6px;
    background:transparent;color:var(--berry);cursor:pointer;font-weight:600;
  }
  .crit-toggle.active{background:var(--berry);color:#fff;}
  .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start;}
  @media (max-width:760px){.grid{grid-template-columns:1fr;}}
  section.panel{
    background:var(--bg-card);
    border:1px solid var(--border-soft);
    border-radius:10px;
    padding:16px 18px 20px;
  }
  section.panel h2{
    font-size:1.05rem;margin:0 0 12px;font-weight:600;
    border-bottom:1px solid var(--border-soft);padding-bottom:8px;
  }
  .ability-row{
    display:grid;
    grid-template-columns:44px 60px 1fr auto auto auto;
    align-items:center;
    gap:8px;
    padding:7px 0;
    border-bottom:1px solid var(--border-soft);
    font-family:-apple-system,"Segoe UI",sans-serif;
  }
  .ability-row:last-child{border-bottom:none;}
  .ability-group{margin-bottom:2px;}
  .skills-wrap{margin-bottom:6px;}
  .skill-row{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:5px 0 5px 20px;
    margin-left:8px;
    border-left:2px solid var(--border-soft);
    border-bottom:1px solid var(--border-soft);
    font-family:-apple-system,"Segoe UI",sans-serif;
  }
  .skill-row:last-child{border-bottom:none;}
  .skill-row .skill-name{flex:1 1 100px;font-size:0.8rem;color:var(--ink-soft);}
  .skill-row label.prof{display:flex;align-items:center;gap:4px;font-size:0.72rem;color:var(--ink-soft);}
  .skill-row .roll-btn{font-size:0.72rem;padding:4px 8px;}
  .ability-name{font-weight:700;font-size:0.85rem;letter-spacing:0.02em;color:var(--ink);}
  .ability-row input[type=number]{
    width:52px;padding:5px 6px;border:1px solid var(--border);border-radius:4px;
    background:var(--bg);color:var(--ink);font-size:0.85rem;
  }
  .ability-row label.prof{
    display:flex;align-items:center;gap:4px;font-size:0.75rem;color:var(--ink-soft);
  }
  .attack-fields label.prof{
    display:flex;align-items:center;gap:4px;font-size:0.75rem;color:var(--ink-soft);
  }
  .roll-btn{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.78rem;padding:6px 9px;border-radius:5px;border:1px solid var(--moss);
    background:transparent;color:var(--moss-dark);cursor:pointer;white-space:nowrap;
  }
  .roll-btn:hover{background:var(--moss);color:#fff;}
  .roll-btn.save{border-color:var(--ochre);color:var(--ochre);}
  .roll-btn.crit-armed{
    background:var(--berry);border-color:var(--berry);color:#fff;font-weight:700;
  }
  .roll-btn.crit-armed:hover{background:var(--berry);color:#fff;opacity:0.88;}
  .roll-btn.save:hover{background:var(--ochre);color:#fff;}
  .attack{
    border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;margin-bottom:10px;
    font-family:-apple-system,"Segoe UI",sans-serif;
  }
  .attack-top{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .attack-top input[type=text]{
    flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:4px;
    background:var(--bg);color:var(--ink);font-size:0.88rem;font-weight:600;
  }
  .attack-top button.del{
    background:none;border:none;color:var(--berry);font-size:1rem;cursor:pointer;padding:2px 6px;
  }
  .attack-preset{
    font-family:-apple-system,"Segoe UI",sans-serif;
    padding:6px 7px;border:1px solid var(--border);border-radius:4px;
    background:var(--bg);color:var(--ink);font-size:0.8rem;
  }
  .attack-note{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.75rem;font-style:italic;color:var(--ink-soft);margin:-4px 0 8px;
  }
  .attack-note-details{
    margin:-4px 0 8px;
  }
  .attack-note-details summary{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.75rem;color:var(--moss-dark);cursor:pointer;
    list-style:none;display:inline-flex;align-items:center;gap:4px;
  }
  .attack-note-details summary::-webkit-details-marker{display:none;}
  .attack-note-details summary::before{
    content:"▸";font-size:0.65rem;transition:transform .12s ease;
  }
  .attack-note-details[open] summary::before{transform:rotate(90deg);}
  .attack-note-details summary:hover{color:var(--moss);}
  .weapon-category-tag{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.62rem;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;
    color:var(--ink-soft);background:var(--bg);border:1px solid var(--border-soft);
    border-radius:4px;padding:2px 6px;margin-left:6px;
  }
  .damage-type-tag{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.62rem;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;
    color:var(--berry);background:var(--bg);border:1px solid var(--border-soft);
    border-radius:4px;padding:2px 6px;margin-left:6px;
  }
  .spell-ability-select{
    display:flex;align-items:center;gap:8px;
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.8rem;color:var(--ink-soft);
    margin-bottom:10px;
  }
  .spell-ability-select select{
    padding:5px 7px;border:1px solid var(--border);border-radius:4px;
    background:var(--bg-card);color:var(--ink);font-size:0.85rem;
  }
  .spell-ability-override{
    display:flex;align-items:center;gap:8px;
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.75rem;color:var(--ink-soft);
    margin:2px 0 8px;
  }
  .spell-ability-override select{
    padding:4px 6px;border:1px solid var(--border);border-radius:4px;
    background:var(--bg);color:var(--ink);font-size:0.78rem;
  }
  .spell-info-table{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.75rem;color:var(--ink-soft);
    display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:2px 0 8px;
  }
  .spell-info-table dt{font-weight:700;color:var(--ink);}
  .spell-info-table dd{margin:0;}
  .spell-description{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.75rem;font-style:italic;color:var(--ink-soft);
    margin:6px 0 0;padding-top:6px;border-top:1px solid var(--border-soft);
  }
  .save-dc-badge{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.72rem;color:var(--ochre);font-weight:700;margin-left:6px;
  }
  .spell-notes{
    width:100%;min-height:70px;margin-top:4px;padding:7px 8px;box-sizing:border-box;
    border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",sans-serif;font-size:0.78rem;resize:vertical;
  }
  .attack-note-details .attack-note-body{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.75rem;font-style:italic;color:var(--ink-soft);
    margin:4px 0 0 14px;
  }
  .roll-btn[disabled]{
    opacity:0.45;cursor:not-allowed;
  }
  .roll-btn[disabled]:hover{background:transparent;color:var(--moss-dark);}
  .attack-fields{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:0.8rem;color:var(--ink-soft);}
  .attack-fields input{
    padding:5px 6px;border:1px solid var(--border);border-radius:4px;
    background:var(--bg);color:var(--ink);font-size:0.82rem;
  }
  .attack-fields input[type=number]{width:48px;}
  .attack-fields input.atk-bonus{width:68px;text-align:center;}
  .attack-fields input.dmg-bonus{width:48px;text-align:center;}
  .attack-fields input.ammo-count{width:48px;text-align:center;}
  .attack-fields input.ammo-count.ammo-empty{border-color:var(--berry);color:var(--berry);font-weight:700;}
  .attack-fields input:disabled{
    opacity:0.6;
    color:var(--ink-soft);
    border-style:dashed;
    background-image:repeating-linear-gradient(45deg, var(--border-soft), var(--border-soft) 4px, var(--bg-card) 4px, var(--bg-card) 8px);
    cursor:not-allowed;
  }
  .attack-fields input.auto-value{
    background:var(--bg-card);
    border-color:var(--moss);
    color:var(--moss-dark);
    font-weight:700;
    cursor:default;
  }
  .attack-fields label.disabled-field{opacity:0.55;}
  .attack-fields input[type=text].dice{width:64px;}
  .attack-fields label{display:flex;align-items:center;gap:4px;}
  #add-attack{
    font-family:-apple-system,"Segoe UI",sans-serif;
    width:100%;padding:9px;border:1px dashed var(--border);border-radius:6px;
    background:transparent;color:var(--ink-soft);cursor:pointer;font-size:0.85rem;margin-top:4px;
  }
  #add-attack:hover{border-color:var(--moss);color:var(--moss-dark);}
  #add-spell{
    font-family:-apple-system,"Segoe UI",sans-serif;
    width:100%;padding:9px;border:1px dashed var(--border);border-radius:6px;
    background:transparent;color:var(--ink-soft);cursor:pointer;font-size:0.85rem;margin-top:4px;
  }
  #add-spell:hover{border-color:var(--moss);color:var(--moss-dark);}
  .prof-panel{margin-top:22px;}
  .prof-list{display:flex;flex-direction:column;}
  .prof-row{
    display:flex;align-items:center;gap:8px;padding:6px 0;
    border-bottom:1px solid var(--border-soft);
    font-family:-apple-system,"Segoe UI",sans-serif;
  }
  .prof-row:last-child{border-bottom:none;}
  .prof-row input[type=text]{
    flex:1;padding:6px 8px;border:1px solid var(--border);border-radius:4px;
    background:var(--bg);color:var(--ink);font-size:0.88rem;
  }
  .prof-row button.del{
    background:none;border:none;color:var(--berry);font-size:1rem;cursor:pointer;padding:2px 6px;
  }
  #add-prof{
    font-family:-apple-system,"Segoe UI",sans-serif;
    width:100%;padding:9px;border:1px dashed var(--border);border-radius:6px;
    background:transparent;color:var(--ink-soft);cursor:pointer;font-size:0.85rem;margin-top:8px;
  }
  #add-prof:hover{border-color:var(--moss);color:var(--moss-dark);}
  .prof-bulk-details{margin-top:10px;}
  .prof-bulk-details summary{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.78rem;color:var(--moss-dark);cursor:pointer;
  }
  .prof-bulk-area{
    width:100%;min-height:80px;margin-top:6px;padding:7px 8px;box-sizing:border-box;
    border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",sans-serif;font-size:0.8rem;resize:vertical;
  }
  #prof-bulk-add{
    font-family:-apple-system,"Segoe UI",sans-serif;
    margin-top:6px;padding:6px 12px;border:1px solid var(--moss);border-radius:5px;
    background:transparent;color:var(--moss-dark);cursor:pointer;font-size:0.8rem;
  }
  #prof-bulk-add:hover{background:var(--moss);color:#fff;}
  #log{
    margin-top:22px;background:var(--bg-card);border:1px solid var(--border-soft);
    border-radius:10px;padding:14px 18px;
  }
  #log h2{font-size:1.05rem;margin:0 0 10px;font-weight:600;}
  #log-list{max-height:260px;overflow-y:auto;display:flex;flex-direction:column-reverse;gap:0;}
  .log-entry{
    display:flex;justify-content:space-between;gap:10px;
    padding:7px 0;border-bottom:1px solid var(--border-soft);
    font-family:-apple-system,"Segoe UI",sans-serif;font-size:0.85rem;
  }
  .log-entry:first-child{border-bottom:none;}
  .log-entry .label{color:var(--ink-soft);}
  .log-entry .total{font-weight:700;}
  .log-entry .total.crit{color:var(--moss);}
  .log-entry .total.fumble{color:var(--berry);}
  .log-empty{color:var(--ink-soft);font-size:0.85rem;font-family:-apple-system,"Segoe UI",sans-serif;}
  #clear-log{
    font-family:-apple-system,"Segoe UI",sans-serif;
    font-size:0.75rem;background:none;border:none;color:var(--ink-soft);
    cursor:pointer;text-decoration:underline;margin-top:8px;
  }
</style>

<body>
<div class="wrap">

  <header>
    <div>
      <h1>Roll Tracker <span class="title-info-icon" id="title-info-icon">i</span></h1>
      <div class="sync-status" id="sync-status"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">Offline</span></div>
      <button type="button" id="change-account-btn" class="change-account-btn">Change Account</button>
    </div>
    <div class="header-right">
      <div class="version-tag">Version 1.38.1</div>
      <div class="char-tabs" id="char-tabs"></div>
      <div class="quickroll" id="quickroll"></div>
    </div>
  </header>

  <div class="sheet-content" id="sheet-content">

  <div class="settings-bar">
    <label>Proficiency Bonus
      <input type="number" id="prof-bonus" value="2">
    </label>
    <div class="mode-group" id="mode-group">
      <button data-mode="dis">Disadvantage</button>
      <button data-mode="normal" class="active">Normal</button>
      <button data-mode="adv">Advantage</button>
    </div>
    <button type="button" class="crit-toggle" id="crit-toggle" title="Force the next Damage roll to double its dice — for auto-crit effects like Assassinate.">Crit</button>
  </div>

  <section class="panel">
    <h2>Ability Checks &amp; Saves</h2>
    <div id="abilities"></div>
  </section>

  <div class="grid">
    <section class="panel">
      <h2>Weapon Attacks</h2>
      <div id="attacks"></div>
      <button id="add-attack">+ Add Weapon Attack</button>
    </section>

    <section class="panel">
      <h2>Spell Attacks</h2>
      <label class="spell-ability-select">Spellcasting Ability
        <select id="spell-ability"></select>
      </label>
      <div id="spells"></div>
      <button id="add-spell">+ Add Spell Attack</button>
    </section>
  </div>

  <div id="log">
    <h2>Roll Log</h2>
    <div id="log-list"></div>
    <button id="clear-log">Clear log</button>
  </div>

  <section class="panel prof-panel">
    <h2>Proficiencies</h2>
    <div id="proficiencies" class="prof-list"></div>
    <button id="add-prof">+ Add Proficiency</button>
    <details class="prof-bulk-details">
      <summary>Paste a list instead</summary>
      <textarea id="prof-bulk-input" class="prof-bulk-area" placeholder="One per line, e.g.&#10;Clubs (Druid)&#10;Daggers (Druid)&#10;Scimitars (Druid)"></textarea>
      <button id="prof-bulk-add" type="button">Add all lines</button>
    </details>
  </section>

  <div class="lock-overlay" id="lock-overlay">
    <div class="lock-overlay-box">
      <div class="lock-overlay-icon">🔒</div>
      <div class="lock-overlay-title">This tab is locked</div>
      <button type="button" id="lock-overlay-unlock">Unlock</button>
    </div>
  </div>

  </div>

</div>

        var oldParsed = JSON.parse(oldRaw);

          oldParsed.color = TAB_COLORS[0];
          migrated.characters[0] = oldParsed;

      var isAuto = abilityBonus !== null && !noAttackRollField;
      var athleticsLinked = currentPreset && currentPreset.athleticsLinked;

      var athleticsSkill = athleticsLinked ? getSkillByName("Athletics") : null;
      var effectiveProf = athleticsLinked ? !!(athleticsSkill && athleticsSkill.prof) : !!atk.prof;
      var effectiveProfPart = effectiveProf ? (state.profBonus||0) * ((athleticsLinked && athleticsSkill && athleticsSkill.expertise) ? 2 : 1) : 0;

      var lycanScaling = !!(currentPreset && currentPreset.lycanScaling);
      var lycanLevel = lycanScaling ? (atk.lycanLevel || 0) : 0;
      var lycanBonuses = lycanScaling ? computeLycanBonuses(lycanLevel) : {feral:0, stalker:0};
      var totalAtkAutoPart = effectiveProfPart + (lycanScaling ? lycanBonuses.stalker : 0);

      atkLabel.textContent = "Atk bonus" + (isAuto ? " (auto)" : "");

      var atkInput = document.createElement("input");
      atkInput.type = "text";
      atkInput.className = "atk-bonus" + (isAuto ? " auto-value" : "");

      if(noAttackRollField){
        atkInput.value = "N/A";
        atkInput.disabled = true;
        atkInput.title = "This uses a saving throw, not an attack roll — there's no attack bonus to add.";
      } else if(isAuto){
        atkInput.value = totalAtkAutoPart !== 0
          ? (signStr(abilityBonus) + " " + signStr(totalAtkAutoPart))
          : signStr(abilityBonus);
        atkInput.readOnly = true;
        var abilityUsed = currentPreset.ability === "finesse"
          ? (getAbilityMod("STR") >= getAbilityMod("DEX") ? "STR" : "DEX") + " (Finesse: best of STR/DEX)"
          : currentPreset.ability;
        var profNote = athleticsLinked
          ? (effectiveProf ? " + proficiency bonus (from Athletics" + ((athleticsSkill && athleticsSkill.expertise) ? ", doubled by Expertise" : "") + ")" : "")
          : (effectiveProf ? " + proficiency bonus" : "");
        var lycanAtkNote = (lycanScaling && lycanBonuses.stalker) ? " + Stalker's Prowess (+" + lycanBonuses.stalker + ")" : "";
        atkInput.title = abilityUsed + " modifier" + profNote + lycanAtkNote + ", auto-calculated. Switch to Custom to enter this manually.";
      } else {
        atkInput.value = effectiveProfPart !== 0 ? (String(atk.atk) + " " + signStr(effectiveProfPart)) : String(atk.atk);
        atkInput.title = effectiveProfPart !== 0
          ? ("Editable — the number before the space is your manual bonus; " + signStr(effectiveProfPart) + " is your proficiency bonus, added automatically because prof is checked below.")
          : "Editable — check prof below to add your proficiency bonus automatically when rolling.";
      }

      if(noAttackRollField) atkLabel.classList.add("disabled-field");
      atkInput.addEventListener("input", function(){
        if(atkInput.readOnly || atkInput.disabled) return;
        state.attacks[idx].atk = parseInt(atkInput.value,10) || 0;
        saveState();
      });
      atkLabel.appendChild(atkInput);

      var atkProfLabel = document.createElement("label");
      atkProfLabel.className = "prof";
      var atkProfCheck = document.createElement("input");
      atkProfCheck.type = "checkbox";
      atkProfCheck.checked = effectiveProf;
      if(noAttackRollField || athleticsLinked){
        atkProfCheck.disabled = true;
        atkProfLabel.classList.add("disabled-field");
      }
      if(athleticsLinked){
        atkProfCheck.title = "Pulled from your Athletics skill's proficiency/expertise below — toggle it there instead.";
      }
      atkProfCheck.addEventListener("change", function(){
        if(athleticsLinked) return;
        state.attacks[idx].prof = atkProfCheck.checked;
        saveState();
        renderAttacks();
      });
      atkProfLabel.appendChild(atkProfCheck);
      atkProfLabel.appendChild(document.createTextNode("prof"));

      var lycanLevelLabel = null;
      if(lycanScaling){
        lycanLevelLabel = document.createElement("label");
        lycanLevelLabel.textContent = "Blood Hunter Lvl";
        var lycanLevelInput = document.createElement("input");
        lycanLevelInput.type = "number";
        lycanLevelInput.min = "3";
        lycanLevelInput.max = "20";
        lycanLevelInput.value = lycanLevel || 3;
        lycanLevelInput.title = "Your Blood Hunter level — drives Feral Might (damage) and Stalker's Prowess (attack) below automatically.";
        lycanLevelInput.addEventListener("input", function(){
          state.attacks[idx].lycanLevel = parseInt(lycanLevelInput.value,10) || 3;
          saveState();
          renderAttacks();
        });
        lycanLevelLabel.appendChild(lycanLevelInput);
      }

      var noDamageField = currentPreset && currentPreset.noDamage;
      var versatileCapable = !noDamageField && ((atk.preset === "custom") || !!(currentPreset && currentPreset.versatileDice));
      var twoHandedOn = versatileCapable && !!atk.twoHanded;
      var activeDiceField = twoHandedOn ? "dice2h" : "dice";

      var diceLabel = document.createElement("label");
      diceLabel.textContent = "Damage" + (twoHandedOn ? " (2H)" : "");
      var diceInput = document.createElement("input");
      diceInput.type = "text";
      diceInput.className = "dice";
      if(noDamageField){
        diceInput.value = "N/A";
        diceInput.disabled = true;
        diceInput.title = "This weapon deals no damage — it restrains the target instead.";
        diceLabel.classList.add("disabled-field");
      } else {
        diceInput.value = atk[activeDiceField] || "";
        diceInput.placeholder = twoHandedOn ? "e.g. 1d8" : "1d6";
        diceInput.title = "You can mix dice sizes here, e.g. 1d8+1d4 for a shortbow plus a Hunter's Mark bonus.";
      }
      diceInput.addEventListener("input", function(){
        if(diceInput.disabled) return;
        state.attacks[idx][activeDiceField] = diceInput.value;
        saveState();
      });
      diceLabel.appendChild(diceInput);

      var versatileLabel = null;
      if(versatileCapable){
        versatileLabel = document.createElement("label");
        versatileLabel.className = "prof";
        var versatileCheck = document.createElement("input");
        versatileCheck.type = "checkbox";
        versatileCheck.checked = !!atk.twoHanded;
        versatileCheck.title = atk.preset === "custom"
          ? "Toggle to switch the Damage field to a separate two-handed die you set yourself."
          : "Toggle to use this weapon's two-handed Versatile die instead.";
        versatileCheck.addEventListener("change", function(){
          state.attacks[idx].twoHanded = versatileCheck.checked;
          saveState();
          renderAttacks();
        });
        versatileLabel.appendChild(versatileCheck);
        versatileLabel.appendChild(document.createTextNode("2H"));
      }

      var dmgBonusLabel = document.createElement("label");
      dmgBonusLabel.textContent = "+";
      var dmgBonusInput = document.createElement("input");
      dmgBonusInput.type = noDamageField ? "text" : "number";
      dmgBonusInput.className = "dmg-bonus";
      if(noDamageField){
        dmgBonusInput.value = "N/A";
        dmgBonusInput.disabled = true;
        dmgBonusInput.title = "This weapon deals no damage — it restrains the target instead.";
        dmgBonusLabel.classList.add("disabled-field");
      } else {
        dmgBonusInput.value = atk.dmgBonus;
        dmgBonusInput.title = "Editable — switching this row's weapon will refresh it to that weapon's ability modifier.";
      }
      dmgBonusInput.addEventListener("input", function(){
        if(dmgBonusInput.disabled) return;
        state.attacks[idx].dmgBonus = parseInt(dmgBonusInput.value,10) || 0;
        saveState();
      });
      dmgBonusLabel.appendChild(dmgBonusInput);

      var feralLabel = null;
      if(lycanScaling){
        feralLabel = document.createElement("label");
        feralLabel.textContent = "Feral Might";
        var feralInput = document.createElement("input");
        feralInput.type = "text";
        feralInput.className = "dmg-bonus auto-value";
        feralInput.value = signStr(lycanBonuses.feral);
        feralInput.disabled = true;
        feralInput.title = "Feral Might — added to the damage roll automatically, based on the Blood Hunter level above (+1 from 3rd level, +2 at 11th, +3 at 18th).";
        feralLabel.appendChild(feralInput);
      }

      var ammoActive = !!atk.ammoEnabled;
      var outOfAmmo = ammoActive && (atk.ammo || 0) <= 0;

      var atkBtn = document.createElement("button");
      atkBtn.className = "roll-btn";
      var noAttackRoll = currentPreset && currentPreset.noAttackRoll;
      atkBtn.textContent = noAttackRoll ? "No attack roll" : (outOfAmmo ? "No Ammo" : ((currentPreset && currentPreset.attackLabel) ? currentPreset.attackLabel : "Attack Roll"));
      if(noAttackRoll){
        atkBtn.disabled = true;
        atkBtn.title = "This uses a saving throw, not an attack roll — the target rolls, not you.";
      } else if(outOfAmmo){
        atkBtn.disabled = true;
        atkBtn.title = "Out of ammo — refill the count to keep attacking with this weapon.";
      }
      atkBtn.addEventListener("click", function(){
        if(noAttackRoll || outOfAmmo) return;
        var d = rollD20();
        var a = state.attacks[idx];
        var baseBonus = isAuto ? computeAbilityBonus(a.preset || "custom") : (a.atk || 0);
        var profAdd;
        if(athleticsLinked){
          var freshAthletics = getSkillByName("Athletics");
          profAdd = freshAthletics && freshAthletics.prof ? (state.profBonus||0) * (freshAthletics.expertise ? 2 : 1) : 0;
        } else {
          profAdd = a.prof ? (state.profBonus||0) : 0;
        }
        var freshStalkerBonus = lycanScaling ? computeLycanBonuses(a.lycanLevel||0).stalker : 0;
        var liveBonus = baseBonus + profAdd + freshStalkerBonus;
        var total = d.value + liveBonus;
        var partsStr = "d20(" + d.rolls.join("/") + ") + " + liveBonus;
        var logLabel = (currentPreset && currentPreset.attackLabel) ? (a.name + " Check") : (a.name + " Attack");
        addLog(logLabel, partsStr, total, true, d.value===20?"crit":d.value===1?"fumble":null);

        if(ammoActive){
          a.ammo = Math.max(0, (a.ammo || 0) - 1);
        }

        // A natural 20 on a damage-dealing attack arms a one-time crit for this weapon's next Damage roll.
        // Each new attack roll resets it, so an older crit can't carry over to a non-crit hit.
        var canCrit = !noDamageField && !(currentPreset && currentPreset.attackLabel);
        var nowArmed = canCrit && d.value === 20;
        var wasArmed = !!a.critArmed;
        a.critArmed = nowArmed;
        if(ammoActive || nowArmed !== wasArmed){
          saveState();
          renderAttacks();
        }
      });

      var dmgBtn = document.createElement("button");
      var critArmed = !!atk.critArmed && !noDamageField;
      dmgBtn.className = "roll-btn save" + (critArmed ? " crit-armed" : "");
      dmgBtn.textContent = noDamageField ? "No damage" : (critArmed ? "Damage (Crit!)" : "Damage");
      if(critArmed){
        dmgBtn.title = "Natural 20! The next Damage roll for this weapon will double its dice.";
      }
      if(noDamageField){
        dmgBtn.disabled = true;
        dmgBtn.title = "This weapon deals no damage — it restrains the target instead.";
      }
      dmgBtn.addEventListener("click", function(){
        if(noDamageField) return;
        var a = state.attacks[idx];
        var diceField = (versatileCapable && a.twoHanded) ? "dice2h" : "dice";
        var parsed = parseDiceGroups(a[diceField]);
        if(!parsed){
          addLog(a.name + " Damage", "invalid dice — use format like 1d6 or 1d8+1d4", 0, false, null);
          return;
        }
        var wasArmed = !!a.critArmed;
        var isCrit = !!state.critMode || wasArmed;
        var rolled = rollDiceGroups(parsed, isCrit);
        var freshDmgBonus = a.dmgBonus || 0;
        var freshFeralBonus = lycanScaling ? computeLycanBonuses(a.lycanLevel||0).feral : 0;
        var total = rolled.total + freshDmgBonus + freshFeralBonus;
        var partsStr = rolled.partsStr + " + " + freshDmgBonus + (freshFeralBonus ? " + " + freshFeralBonus + " (Feral Might)" : "");
        addLog(a.name + " Damage" + (a.twoHanded ? " (2H)" : "") + (isCrit ? " (Crit)" : ""), partsStr, total, false, null);

        // The nat-20 crit is one-time: spend it now. (The manual Crit toggle is separate and stays on.)
        if(wasArmed){
          a.critArmed = false;
          saveState();
          renderAttacks();
        }
      });

      var ammoToggleLabel = null;
      if((atk.preset || "custom") === "custom"){
        ammoToggleLabel = document.createElement("label");
        ammoToggleLabel.className = "prof";
        var ammoToggleCheck = document.createElement("input");
        ammoToggleCheck.type = "checkbox";
        ammoToggleCheck.checked = !!atk.ammoEnabled;
        ammoToggleCheck.title = "Track an ammo count for this custom weapon.";
        ammoToggleCheck.addEventListener("change", function(){
          state.attacks[idx].ammoEnabled = ammoToggleCheck.checked;
          if(ammoToggleCheck.checked && !state.attacks[idx].ammo){
            state.attacks[idx].ammo = 20;
          }
          saveState();
          renderAttacks();
        });
        ammoToggleLabel.appendChild(ammoToggleCheck);
        ammoToggleLabel.appendChild(document.createTextNode("Track Ammo"));
      }

      var ammoCountLabel = null;
      if(ammoActive){
        ammoCountLabel = document.createElement("label");
        ammoCountLabel.textContent = "Ammo";
        var ammoCountInput = document.createElement("input");
        ammoCountInput.type = "number";
        ammoCountInput.className = "ammo-count" + (outOfAmmo ? " ammo-empty" : "");
        ammoCountInput.min = "0";
        ammoCountInput.value = atk.ammo || 0;
        ammoCountInput.title = "Current ammo count — drops by 1 on every Attack Roll. Edit to restock.";
        ammoCountInput.addEventListener("input", function(){
          state.attacks[idx].ammo = Math.max(0, parseInt(ammoCountInput.value,10) || 0);
          saveState();
          renderAttacks();
        });
        ammoCountLabel.appendChild(ammoCountInput);
      }

      // A plain "how many do I have on me" counter for weapons you carry several of (daggers,
      // handaxes, javelins...). Unlike Ammo, this never auto-decrements on Attack Roll — you're not
      // necessarily throwing it and losing it every time you swing — so it's a purely manual count.
      var qtyToggleLabel = null;
      if((atk.preset || "custom") === "custom"){
        qtyToggleLabel = document.createElement("label");
        qtyToggleLabel.className = "prof";
        var qtyToggleCheck = document.createElement("input");
        qtyToggleCheck.type = "checkbox";
        qtyToggleCheck.checked = !!atk.qtyEnabled;
        qtyToggleCheck.title = "Track a \"how many I'm carrying\" count for this custom weapon.";
        qtyToggleCheck.addEventListener("change", function(){
          state.attacks[idx].qtyEnabled = qtyToggleCheck.checked;
          if(qtyToggleCheck.checked && !state.attacks[idx].qty){
            state.attacks[idx].qty = 1;
          }
          saveState();
          renderAttacks();
        });
        qtyToggleLabel.appendChild(qtyToggleCheck);
        qtyToggleLabel.appendChild(document.createTextNode("Track Count"));
      }

      var qtyCountLabel = null;
      if(atk.qtyEnabled){
        qtyCountLabel = document.createElement("label");
        qtyCountLabel.textContent = "Carrying";
        var qtyCountInput = document.createElement("input");
        qtyCountInput.type = "number";
        qtyCountInput.className = "ammo-count" + ((atk.qty||0) <= 0 ? " ammo-empty" : "");
        qtyCountInput.min = "0";
        qtyCountInput.value = atk.qty || 0;
        qtyCountInput.title = "How many of this weapon you're carrying — edit this yourself if you lose, break, or pick one up (it never changes automatically).";
        qtyCountInput.addEventListener("input", function(){
          state.attacks[idx].qty = Math.max(0, parseInt(qtyCountInput.value,10) || 0);
          saveState();
          renderAttacks();
        });
        qtyCountLabel.appendChild(qtyCountInput);
      }

      fields.appendChild(atkLabel);
      fields.appendChild(atkProfLabel);
      if(lycanLevelLabel) fields.appendChild(lycanLevelLabel);
      fields.appendChild(diceLabel);
      if(versatileLabel) fields.appendChild(versatileLabel);
      fields.appendChild(dmgBonusLabel);
      if(feralLabel) fields.appendChild(feralLabel);
      fields.appendChild(atkBtn);
      fields.appendChild(dmgBtn);
      if(ammoToggleLabel) fields.appendChild(ammoToggleLabel);
      if(ammoCountLabel) fields.appendChild(ammoCountLabel);
      if(qtyToggleLabel) fields.appendChild(qtyToggleLabel);
      if(qtyCountLabel) fields.appendChild(qtyCountLabel);

      box.appendChild(fields);
      attacksEl.appendChild(box);
    });
  }

  document.getElementById("add-attack").addEventListener("click", function(){
    state.attacks.push({preset:"custom", name:"New Attack", atk:0, dice:"1d6", dmgBonus:0, prof:false, critArmed:false, twoHanded:false, dice2h:"", ammoEnabled:false, ammo:0});
    saveState();
    renderAttacks();
  });

  // ---------- Spell Attacks ----------
  var spellsEl = document.getElementById("spells");
  var spellAbilitySelectEl = document.getElementById("spell-ability");

  // The usual three (INT/WIS/CHA) cover standard spellcasting classes, but niche sources — an Air
  // Genasi's innate Levitate using CON, a feat or homebrew tying a spell to STR or DEX — need the
  // rest available too, so every ability is offered here and in each spell's own override below.
  var SPELL_ABILITY_OPTIONS = ["STR","DEX","CON","INT","WIS","CHA"];

  function renderSpellAbilitySelect(){
    spellAbilitySelectEl.innerHTML = "";
    SPELL_ABILITY_OPTIONS.forEach(function(a){
      var opt = document.createElement("option");
      opt.value = a;
      opt.textContent = a;
      if((state.spellAbility || "WIS") === a) opt.selected = true;
      spellAbilitySelectEl.appendChild(opt);
    });
  }

  spellAbilitySelectEl.addEventListener("change", function(){
    state.spellAbility = spellAbilitySelectEl.value;
    saveState();
    renderSpells();
  });

  function renderSpells(){
    spellsEl.innerHTML = "";
    state.spells.forEach(function(sp, idx){
      var box = document.createElement("div");
      box.className = "attack";

      var presetSelect = document.createElement("select");
      presetSelect.className = "attack-preset";
      var customOpt = document.createElement("option");
      customOpt.value = "custom";
      customOpt.textContent = SPELL_PRESETS.custom.label;
      if((sp.preset || "custom") === "custom") customOpt.selected = true;
      presetSelect.appendChild(customOpt);
      SPELL_CATEGORY_ORDER.forEach(function(cat){
        var keysInCat = SPELL_PRESET_ORDER.filter(function(key){ return SPELL_PRESETS[key].category === cat; });
        if(!keysInCat.length) return;
        var group = document.createElement("optgroup");
        group.label = cat;
        keysInCat.forEach(function(key){
          var opt = document.createElement("option");
          opt.value = key;
          opt.textContent = SPELL_PRESETS[key].label;
          if((sp.preset || "custom") === key) opt.selected = true;
          group.appendChild(opt);
        });
        presetSelect.appendChild(group);
      });
      presetSelect.addEventListener("change", function(){
        var key = presetSelect.value;
        var preset = SPELL_PRESETS[key];
        state.spells[idx].preset = key;
        state.spells[idx].critArmed = false;
        state.spells[idx].notFullHp = false;
        if(key !== "custom"){
          state.spells[idx].name = preset.name;
          state.spells[idx].dice = preset.dice;
          state.spells[idx].dmgBonus = 0;
        } else {
          // Switching back to Custom should clear out whatever spell preset was there before,
          // not leave its name/dice behind in the editable fields.
          state.spells[idx].name = SPELL_PRESETS.custom.name;
          state.spells[idx].dice = SPELL_PRESETS.custom.dice;
          state.spells[idx].dmgBonus = 0;
        }
        saveState();
        renderSpells();
      });

      var top = document.createElement("div");
      top.className = "attack-top";
      var nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.value = sp.name;
      nameInput.addEventListener("input", function(){
        state.spells[idx].name = nameInput.value;
        saveState();
      });
      var delBtn = document.createElement("button");
      delBtn.className = "del";
      delBtn.textContent = "✕";
      delBtn.title = "Remove spell";
      delBtn.addEventListener("click", function(){
        state.spells.splice(idx,1);
        saveState();
        renderSpells();
      });
      top.appendChild(presetSelect);
      top.appendChild(nameInput);
      top.appendChild(delBtn);

      var currentSpell = SPELL_PRESETS[sp.preset] || SPELL_PRESETS.custom;
      var isCustomSpell = (sp.preset || "custom") === "custom";

      var noteDetails = document.createElement("details");
      noteDetails.className = "attack-note-details";
      var noteSummary = document.createElement("summary");
      noteSummary.appendChild(document.createTextNode("More Information"));
      if(currentSpell.category){
        var catTag = document.createElement("span");
        catTag.className = "weapon-category-tag";
        catTag.textContent = currentSpell.category;
        noteSummary.appendChild(catTag);
      }
      if(currentSpell.damageType){
        var dmgTypeTag = document.createElement("span");
        dmgTypeTag.className = "damage-type-tag";
        dmgTypeTag.textContent = currentSpell.damageType;
        noteSummary.appendChild(dmgTypeTag);
      }
      noteDetails.appendChild(noteSummary);

      var abilityOverrideLabel = document.createElement("label");
      abilityOverrideLabel.className = "spell-ability-override";
      abilityOverrideLabel.appendChild(document.createTextNode("Spellcasting Ability"));
      var abilityOverrideSelect = document.createElement("select");
      var defaultOpt = document.createElement("option");
      defaultOpt.value = "";
      defaultOpt.textContent = "Default (" + (state.spellAbility || "WIS") + ")";
      if(!sp.abilityOverride) defaultOpt.selected = true;
      abilityOverrideSelect.appendChild(defaultOpt);
      SPELL_ABILITY_OPTIONS.forEach(function(a){
        var opt = document.createElement("option");
        opt.value = a;
        opt.textContent = a;
        if(sp.abilityOverride === a) opt.selected = true;
        abilityOverrideSelect.appendChild(opt);
      });
      abilityOverrideSelect.title = "Pin this spell to a specific ability, overriding the character's default above — useful for a feat or multiclass feature that ties one spell to a fixed ability.";
      abilityOverrideSelect.addEventListener("change", function(){
        state.spells[idx].abilityOverride = abilityOverrideSelect.value || null;
        saveState();
        renderSpells();
      });
      abilityOverrideLabel.appendChild(abilityOverrideSelect);
      noteDetails.appendChild(abilityOverrideLabel);

      if(isCustomSpell){
        var notesArea = document.createElement("textarea");
        notesArea.className = "spell-notes";
        notesArea.placeholder = "School, casting time, range, duration, concentration, ritual, components, materials, scaling/upcasting, spell list, description...";
        notesArea.value = sp.notes || "";
        notesArea.addEventListener("input", function(){
          state.spells[idx].notes = notesArea.value;
          saveState();
        });
        noteDetails.appendChild(notesArea);
      } else {
        var infoList = document.createElement("dl");
        infoList.className = "spell-info-table";
        var addRow = function(label, value){
          if(!value) return;
          var dt = document.createElement("dt"); dt.textContent = label;
          var dd = document.createElement("dd"); dd.textContent = value;
          infoList.appendChild(dt);
          infoList.appendChild(dd);
        };
        addRow("School", currentSpell.school);
        addRow("Casting Time", currentSpell.castingTime);
        addRow("Range", currentSpell.range);
        addRow("Duration", currentSpell.duration + (currentSpell.concentration ? " (Concentration)" : ""));
        addRow("Ritual", currentSpell.ritual ? "Yes" : "No");
        addRow("Components", currentSpell.components);
        if(currentSpell.material) addRow("Materials", currentSpell.material);
        if(currentSpell.damageType) addRow("Damage Type", currentSpell.damageType);
        addRow("Spell List", currentSpell.spellLists);
        if(currentSpell.scaling) addRow("Scaling / Upcasting", currentSpell.scaling);
        noteDetails.appendChild(infoList);
        if(currentSpell.description){
          var descEl = document.createElement("div");
          descEl.className = "spell-description";
          descEl.textContent = currentSpell.description;
          noteDetails.appendChild(descEl);
        }
      }
      box.appendChild(top);
      box.appendChild(noteDetails);

      var fields = document.createElement("div");
      fields.className = "attack-fields";

      var noAttackRollField = !!currentSpell.noAttackRoll;
      var resolvedAbility = resolveSpellAbility(sp);
      var spellAtkBonus = computeSpellAttackBonus(sp);

      var atkLabel = document.createElement("label");
      atkLabel.textContent = "Atk bonus" + (noAttackRollField ? "" : " (auto)");
      var atkInput = document.createElement("input");
      atkInput.type = "text";
      atkInput.className = "atk-bonus" + (noAttackRollField ? "" : " auto-value");
      if(noAttackRollField){
        atkInput.value = "N/A";
        atkInput.disabled = true;
        atkInput.title = "This spell uses a saving throw, not an attack roll — the target rolls, not you.";
        atkLabel.classList.add("disabled-field");
      } else {
        atkInput.value = signStr(spellAtkBonus);
        atkInput.readOnly = true;
        atkInput.title = "Proficiency (" + signStr(state.profBonus||0) + ") + " + resolvedAbility + " modifier" + (sp.abilityOverride ? " (overridden for this spell below)" : "") + ", auto-calculated.";
      }
      atkLabel.appendChild(atkInput);
      if(noAttackRollField){
        var dcBadge = document.createElement("span");
        dcBadge.className = "save-dc-badge";
        dcBadge.textContent = "Save DC " + computeSpellSaveDC(sp) + (currentSpell.saveAbility ? " (" + currentSpell.saveAbility + ")" : "");
        atkLabel.appendChild(dcBadge);
      }

      var diceLabel = document.createElement("label");
      diceLabel.textContent = "Damage";
      var diceInput = document.createElement("input");
      diceInput.type = "text";
      diceInput.className = "dice";
      diceInput.value = sp.dice || "";
      diceInput.placeholder = "1d6";
      diceInput.title = "You can mix dice sizes here, e.g. 1d8+1d4.";
      diceInput.addEventListener("input", function(){
        state.spells[idx].dice = diceInput.value;
        saveState();
      });
      diceLabel.appendChild(diceInput);

      var hpToggleLabel = null;
      if(currentSpell.hpToggle){
        hpToggleLabel = document.createElement("label");
        hpToggleLabel.className = "prof";
        var hpToggleCheck = document.createElement("input");
        hpToggleCheck.type = "checkbox";
        hpToggleCheck.checked = !!sp.notFullHp;
        hpToggleCheck.title = "Toll the Dead deals 1d12 instead of 1d8 if the target is missing any of its hit points.";
        hpToggleCheck.addEventListener("change", function(){
          state.spells[idx].notFullHp = hpToggleCheck.checked;
          state.spells[idx].dice = hpToggleCheck.checked ? (currentSpell.altDice || currentSpell.dice) : currentSpell.dice;
          saveState();
          renderSpells();
        });
        hpToggleLabel.appendChild(hpToggleCheck);
        hpToggleLabel.appendChild(document.createTextNode("Target not at full HP"));
      }

      var dmgBonusLabel = document.createElement("label");
      dmgBonusLabel.textContent = "+";
      var dmgBonusInput = document.createElement("input");
      dmgBonusInput.type = "number";
      dmgBonusInput.className = "dmg-bonus";
      dmgBonusInput.value = sp.dmgBonus || 0;
      dmgBonusInput.title = "Most cantrips/spells don't add your spellcasting modifier to damage — check the spell's own rules before changing this.";
      dmgBonusInput.addEventListener("input", function(){
        state.spells[idx].dmgBonus = parseInt(dmgBonusInput.value,10) || 0;
        saveState();
      });
      dmgBonusLabel.appendChild(dmgBonusInput);

      var atkBtn = document.createElement("button");
      atkBtn.className = "roll-btn";
      atkBtn.textContent = noAttackRollField ? "No attack roll" : "Attack Roll";
      if(noAttackRollField){
        atkBtn.disabled = true;
        atkBtn.title = "This spell uses a saving throw — the target rolls, not you.";
      }
      atkBtn.addEventListener("click", function(){
        if(noAttackRollField) return;
        var d = rollD20();
        var freshBonus = computeSpellAttackBonus(state.spells[idx]);
        var total = d.value + freshBonus;
        var partsStr = "d20(" + d.rolls.join("/") + ") + " + freshBonus;
        addLog(state.spells[idx].name + " Attack", partsStr, total, true, d.value===20?"crit":d.value===1?"fumble":null);
        var wasArmed = !!state.spells[idx].critArmed;
        var nowArmed = d.value === 20;
        if(nowArmed !== wasArmed){
          state.spells[idx].critArmed = nowArmed;
          saveState();
          renderSpells();
        }
      });

      var dmgBtn = document.createElement("button");
      var critArmedSp = !!sp.critArmed;
      dmgBtn.className = "roll-btn save" + (critArmedSp ? " crit-armed" : "");
      dmgBtn.textContent = critArmedSp ? "Damage (Crit!)" : "Damage";
      if(critArmedSp){
        dmgBtn.title = "Natural 20! The next Damage roll for this spell will double its dice.";
      }
      dmgBtn.addEventListener("click", function(){
        var s = state.spells[idx];
        var parsed = parseDiceGroups(s.dice);
        if(!parsed){
          addLog(s.name + " Damage", "invalid dice — use format like 1d6 or 1d8+1d4", 0, false, null);
          return;
        }
        var wasArmed = !!s.critArmed;
        var isCrit = !!state.critMode || wasArmed;
        var rolled = rollDiceGroups(parsed, isCrit);
        var total = rolled.total + (s.dmgBonus || 0);
        var partsStr = rolled.partsStr + " + " + (s.dmgBonus||0);
        addLog(s.name + " Damage" + (isCrit ? " (Crit)" : ""), partsStr, total, false, null);
        if(wasArmed){
          s.critArmed = false;
          saveState();
          renderSpells();
        }
      });

      fields.appendChild(atkLabel);
      fields.appendChild(diceLabel);
      if(hpToggleLabel) fields.appendChild(hpToggleLabel);
      fields.appendChild(dmgBonusLabel);
      fields.appendChild(atkBtn);
      fields.appendChild(dmgBtn);

      box.appendChild(fields);
      spellsEl.appendChild(box);
    });
  }

  document.getElementById("add-spell").addEventListener("click", function(){
    state.spells.push({preset:"custom", name:"New Spell", dice:"1d6", dmgBonus:0, critArmed:false, notFullHp:false, notes:""});
    saveState();
    renderSpells();
  });

  document.getElementById("clear-log").addEventListener("click", function(){
    state.log = [];
    saveState();
    renderLog();
  });

  var lockOverlayUnlock = document.getElementById("lock-overlay-unlock");
  if(lockOverlayUnlock){
    lockOverlayUnlock.addEventListener("click", function(){
      setLock(currentAccount, app.activeIndex, false);
      renderTabs();
      updateLockOverlay();
    });
  }

  // ---------- Proficiencies ----------
  var profListEl = document.getElementById("proficiencies");

  function renderProficiencies(){
    profListEl.innerHTML = "";
    state.proficiencies.forEach(function(text, idx){
      var row = document.createElement("div");
      row.className = "prof-row";

      var input = document.createElement("input");
      input.type = "text";
      input.value = text;
      input.addEventListener("input", function(){
        state.proficiencies[idx] = input.value;
        saveState();
      });

      var delBtn = document.createElement("button");
      delBtn.className = "del";
      delBtn.textContent = "✕";
      delBtn.title = "Remove proficiency";
      delBtn.addEventListener("click", function(){
        state.proficiencies.splice(idx,1);
        saveState();
        renderProficiencies();
      });

      row.appendChild(input);
      row.appendChild(delBtn);
      profListEl.appendChild(row);
    });
  }

  document.getElementById("add-prof").addEventListener("click", function(){
    state.proficiencies.push("");
    saveState();
    renderProficiencies();
    var inputs = profListEl.querySelectorAll("input[type=text]");
    if(inputs.length) inputs[inputs.length-1].focus();
  });

  document.getElementById("prof-bulk-add").addEventListener("click", function(){
    var bulkInput = document.getElementById("prof-bulk-input");
    var lines = bulkInput.value.split("\n").map(function(l){ return l.trim(); }).filter(function(l){ return l.length; });
    if(!lines.length) return;
    lines.forEach(function(l){ state.proficiencies.push(l); });
    bulkInput.value = "";
    saveState();
    renderProficiencies();
  });

  renderTabs();
  renderSettingsBar();
  renderAbilities();
  renderAttacks();
  renderSpellAbilitySelect();
  renderSpells();
  renderLog();
  renderProficiencies();
  updateLockOverlay();

  // ---------- Sync bridge (used by the Firebase script below) ----------
  function renderAll(){
    renderTabs();
    renderSettingsBar();
    renderAbilities();
    renderAttacks();
    renderSpellAbilitySelect();
    renderSpells();
    renderLog();
    renderProficiencies();
    updateLockOverlay();
  }

  window.rtBridge = {
    count: function(){ return app.characters.length; },
    getJson: function(i){ return JSON.stringify(app.characters[i]); },
    getCharMeta: function(){
      return app.characters.map(function(c){ return {name: c.name, color: c.color}; });
    },
    switchTab: function(i){
      if(i >= 0 && i < app.characters.length) switchTab(i);
    },
    setCurrentAccount: function(i){
      currentAccount = (typeof i === "number" && i >= 0 && i < app.characters.length) ? i : null;
      renderTabs();
      updateLockOverlay();
    },
    getLocksJson: function(){ return JSON.stringify(app.locks || {}); },
    setLocksFromJson: function(json){
      var parsed;
      try{ parsed = JSON.parse(json); }catch(e){ return; }
      if(!parsed || typeof parsed !== "object") return;
      app.locks = parsed;
      saveState();
      renderTabs();
      updateLockOverlay();
    },
    setFromJson: function(i, json){
      var c;
      try{ c = JSON.parse(json); }catch(e){ return; }
      if(!c || typeof c !== "object") return;
      if(!c.name) c.name = TAB_NAMES[i] || ("Player " + (i+1));
      if(!c.color) c.color = TAB_COLORS[i % TAB_COLORS.length];
      if(!c.log) c.log = [];
      if(!c.proficiencies) c.proficiencies = [];
      if(!c.attacks) c.attacks = [];
      if(!c.spells) c.spells = [];
      if(!c.skills) c.skills = blankSkillList();
      if(!c.abilities) c.abilities = JSON.parse(JSON.stringify(blankAbilities));
      app.characters[i] = c;
      if(i === app.activeIndex){
        state = c;
        renderAll();
      } else {
        renderTabs();
      }
      saveState();
    }
  };
})();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, setPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCoKItW-sZBT8VciZGHmW33O9qvn-BOnQA",
    authDomain: "roll-tracker-6f955.firebaseapp.com",
    databaseURL: "https://roll-tracker-6f955-default-rtdb.firebaseio.com",
    projectId: "roll-tracker-6f955",
    storageBucket: "roll-tracker-6f955.firebasestorage.app",
    messagingSenderId: "748004983496",
    appId: "1:748004983496:web:373bbd1fa42d125300dbfd"
  };

  const SHARED_EMAIL = "groupemail@rolltracker.app";

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getDatabase(fbApp);
  const bridge = window.rtBridge;

  // In-memory persistence means Firebase never remembers the sign-in across a page load —
  // every time the site is opened (or refreshed), onAuthStateChanged below fires with no user
  // and the account-picker + password screen shows again, on purpose.
  await setPersistence(auth, inMemoryPersistence);

  // ---------- Online/offline indicator ----------
  var syncDot = document.getElementById("sync-dot");
  var syncText = document.getElementById("sync-text");
  function setSyncStatus(online, label){
    if(!syncDot) return;
    syncDot.classList.toggle("online", !!online);
    syncText.textContent = label;
  }
  setSyncStatus(false, "Offline");

  // ---------- Account picker + password screen ----------
  var selectedAccountIndex = null;

  function showLogin(){
    // Rebuilt fresh every time (rather than just re-shown) so a renamed tab or recolored
    // character always shows correctly, and so the account selection always starts blank.
    var existing = document.getElementById("rt-login");
    if(existing) existing.remove();
    selectedAccountIndex = null;

    var box = document.createElement("div");
    box.id = "rt-login";
    box.style.cssText = "position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:Georgia,serif;padding:16px;";
    box.innerHTML =
      '<div style="background:var(--bg-card);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:24px;max-width:360px;width:100%;text-align:center;">' +
      '<h2 style="margin:0 0 14px;">Roll Tracker</h2>' +
      '<div class="account-picker-label">Choose Account</div>' +
      '<div class="account-picker" id="rt-account-picker"></div>' +
      '<p style="margin:0 0 14px;color:var(--ink-soft);font-size:0.9rem;">Enter the group password to sync.</p>' +
      '<input id="rt-pw" type="password" placeholder="Password" style="width:100%;padding:9px;margin-bottom:10px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--ink);font-size:1rem;box-sizing:border-box;">' +
      '<button id="rt-go" style="width:100%;padding:9px;border:none;border-radius:5px;background:var(--moss);color:#fff;font-size:1rem;cursor:pointer;">Sign in</button>' +
      '<div id="rt-msg" style="margin-top:10px;color:var(--berry);font-size:0.85rem;min-height:1em;"></div>' +
      '</div>';
    document.body.appendChild(box);

    var picker = document.getElementById("rt-account-picker");
    var meta = bridge.getCharMeta();
    meta.forEach(function(char, i){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "account-picker-btn";
      btn.style.background = char.color;
      btn.textContent = char.name;
      btn.addEventListener("click", function(){
        selectedAccountIndex = i;
        Array.prototype.forEach.call(picker.querySelectorAll(".account-picker-btn"), function(b){
          b.classList.remove("selected");
        });
        btn.classList.add("selected");
      });
      picker.appendChild(btn);
    });

    var pw = document.getElementById("rt-pw");
    var msg = document.getElementById("rt-msg");
    async function tryLogin(){
      if(selectedAccountIndex === null){
        msg.textContent = "Choose an account above first.";
        return;
      }
      msg.textContent = "Signing in...";
      try{
        await signInWithEmailAndPassword(auth, SHARED_EMAIL, pw.value);
        bridge.setCurrentAccount(selectedAccountIndex);
        bridge.switchTab(selectedAccountIndex);
      }catch(e){
        if(e.code === "auth/invalid-credential" || e.code === "auth/wrong-password" || e.code === "auth/invalid-login-credentials"){
          msg.textContent = "That password didn't work.";
        } else if(e.code === "auth/too-many-requests"){
          msg.textContent = "Too many tries. Wait a few minutes and try again.";
        } else {
          msg.textContent = "Couldn't sign in (" + (e.code || "unknown error") + ").";
        }
      }
    }
    document.getElementById("rt-go").addEventListener("click", tryLogin);
    pw.addEventListener("keydown", function(e){ if(e.key === "Enter") tryLogin(); });
  }

  function hideLogin(){
    var box = document.getElementById("rt-login");
    if(box) box.style.display = "none";
  }

  var changeAccountBtn = document.getElementById("change-account-btn");
  if(changeAccountBtn){
    changeAccountBtn.addEventListener("click", function(){
      signOut(auth);
    });
  }

  // ---------- Syncing ----------
  var lastSynced = {};  // tab number -> last JSON text known to match the database
  var ready = {};       // tab number -> true once the database has answered for that tab
  var started = false;
  var lastSyncedLocks = undefined;  // last locks JSON text known to match the database
  var locksReady = false;

  function pushChanges(){
    var n = bridge.count();
    for(var i = 0; i < n; i++){
      if(!ready[i]) continue;
      var local = bridge.getJson(i);
      if(local !== lastSynced[i]){
        lastSynced[i] = local;
        set(ref(db, "rollTracker/chars/" + i), local).catch(function(e){
          console.error("Sync failed", e);
        });
      }
    }
    if(locksReady){
      var localLocks = bridge.getLocksJson();
      if(localLocks !== lastSyncedLocks){
        lastSyncedLocks = localLocks;
        set(ref(db, "rollTracker/locks"), localLocks).catch(function(e){
          console.error("Lock sync failed", e);
        });
      }
    }
  }

  function startSync(){
    if(started) return;
    started = true;

    // One-time safety copy of this device's data before syncing touches it.
    try{
      if(!localStorage.getItem("roll-tracker-backup-before-sync")){
        var current = localStorage.getItem("roll-tracker-app-v2");
        if(current) localStorage.setItem("roll-tracker-backup-before-sync", current);
      }
    }catch(e){}

    // Firebase's special ".info/connected" path is the real signal for whether this device
    // currently has a live socket to the database — it flips to false on a dropped wifi/data
    // connection even while still "signed in", which is exactly what the dot should reflect.
    onValue(ref(db, ".info/connected"), function(snap){
      setSyncStatus(!!snap.val(), snap.val() ? "Syncing" : "Offline");
    });

    var n = bridge.count();
    for(let i = 0; i < n; i++){
      onValue(ref(db, "rollTracker/chars/" + i), function(snap){
        var remote = snap.val();
        if(typeof remote === "string"){
          if(remote !== lastSynced[i]){
            lastSynced[i] = remote;
            if(remote !== bridge.getJson(i)) bridge.setFromJson(i, remote);
          }
        } else if(lastSynced[i] === undefined){
          lastSynced[i] = null;  // database is empty for this tab, so this device will upload it
        }
        ready[i] = true;
      });
    }

    // Locks are per-signed-in-account, but still shared across devices so a lock set on
    // one device is respected if that same account signs in on another device.
    onValue(ref(db, "rollTracker/locks"), function(snap){
      var remote = snap.val();
      if(typeof remote === "string"){
        if(remote !== lastSyncedLocks){
          lastSyncedLocks = remote;
          if(remote !== bridge.getLocksJson()) bridge.setLocksFromJson(remote);
        }
      } else if(lastSyncedLocks === undefined){
        lastSyncedLocks = null;  // database has no locks yet, so this device will upload its own
      }
      locksReady = true;
    });

    setInterval(pushChanges, 1000);
  }

  onAuthStateChanged(auth, function(user){
    if(user){ hideLogin(); startSync(); }
    else { bridge.setCurrentAccount(null); showLogin(); setSyncStatus(false, "Offline"); }
  });
</script>
</body>
</html>
